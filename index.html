<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legenda o Kapesném</title>

  <!-- Firebase kompatibilní skripty (bezpečné pro všechny prohlížeče) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --gold: #f39c12;
      --gold-dark: #d35400;
      --bg-dark: #12100e;
      --card-bg: #1c1815;
      --text-light: #fefefe;
      --accent-red: #e74c3c;
      --accent-green: #2ecc71;
      --gold-border: rgba(243, 156, 18, 0.35);
    }

    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 12px;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, #2a1a0e, #422915);
      color: var(--gold);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-logo-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: bold; font-size: 1.2rem;
    }

    .header-title h1 { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
    .header-status { font-size: 0.72rem; color: #2ecc71; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; }

    .btn-profile-select {
      background: #18110b;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .active-profile-banner {
      background: #18130e;
      border: 1px dashed var(--gold-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #aaa;
      margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .active-profile-banner strong { color: var(--gold); }
    .editor-badge {
      background: var(--gold-dark);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: bold;
    }

    .role-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: #0a0806;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--gold-border);
    }

    .role-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: #888;
      padding: 10px 4px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    .role-tab.active {
      background: var(--gold);
      color: #000;
    }

    .section-title {
      color: var(--gold);
      padding-bottom: 6px;
      margin: 16px 0 10px;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-count {
      background: #2a1e14;
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      border: 1px solid var(--gold-border);
    }

    .task-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--gold-border);
    }

    .task-tags { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .tag-who { background: #332215; color: #f39c12; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .tag-fine { background: #4a1515; color: #ff6b6b; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-name { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .task-desc { font-size: 0.8rem; color: #999; margin-bottom: 12px; }

    .task-reward {
      background: rgba(243, 156, 18, 0.15);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.9rem;
      border: 1px solid var(--gold);
      white-space: nowrap;
    }

    .user-actions { display: flex; flex-direction: column; gap: 6px; }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #120e0b;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-status {
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-todo { background: #1b4d2e; color: #2ecc71; border: 1px solid #2ecc71; }
    .btn-done { background: #2ecc71; color: #000; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0d0a08;
      border-top: 1.5px solid var(--gold);
      padding: 10px 14px;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #666;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .nav-item.active { color: var(--gold); }
    .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">
      <div class="header-logo-icon">💰</div>
      <div class="header-title">
        <h1>LEGENDA O KAPESNÉM</h1>
        <div class="header-status"><span class="status-dot"></span> <span id="db-status-text">Svitky uloženy</span></div>
      </div>
    </div>
    <button class="btn-profile-select">🧙‍♂️ SARUMAN ∨</button>
  </header>

  <div class="active-profile-banner">
    <span>Aktivní profil: <strong>SARUMAN (VLÁDCE STŘEDOZEMĚ)</strong></span>
    <span class="editor-badge">EDITOR</span>
  </div>

  <div class="role-bar">
    <button class="role-tab active">Všechny Questy</button>
    <button class="role-tab">ᛓ Hobit Ady</button>
    <button class="role-tab">🦦 Hobit Vydra</button>
  </div>

  <div class="section-title">
    <span>📜 DENNÍ RITUÁLY & POVINNOSTI</span>
    <span class="badge-count">3</span>
  </div>

  <div id="tasks-container">
    <!-- Úkoly -->
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">📜</div>
      <div>QUESTY</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">⚖️</div>
      <div>RADNÍ SÍŇ</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">💰</div>
      <div>POKLADNICE</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCQjpUXAuZi08D96BX0JKAuGNE4E3xq0Q",
      authDomain: "hobiti-kapesne-2d8ae.firebaseapp.com",
      projectId: "hobiti-kapesne-2d8ae",
      storageBucket: "hobiti-kapesne-2d8ae.firebasestorage.app",
      messagingSenderId: "6584046927",
      appId: "1:6584046927:web:c13c1760d0d1997f4da13a"
    };

    let familyData = null;

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();

      auth.signInAnonymously().then(() => {
        document.getElementById("db-status-text").innerText = "Živě v cloudu";
        initSync(db);
      }).catch(() => {
        document.getElementById("db-status-text").innerText = "Lokální režim";
        loadDefault();
      });
    } catch (e) {
      document.getElementById("db-status-text").innerText = "Lokální režim";
      loadDefault();
    }

    function initSync(db) {
      const docRef = db.collection("families").doc("hlavni_rodina");
      docRef.onSnapshot((docSnap) => {
        if (docSnap.exists) {
          familyData = docSnap.data();
          renderApp();
        } else {
          const defaultData = getDefaultTasks();
          docRef.set(defaultData);
        }
      });
    }

    function getDefaultTasks() {
      return {
        adyGolds: 0,
        vydraGolds: 0,
        tasks: [
          { id: 1, name: "ÚKLID HOBITÍ NORY & STOLU", desc: "Každé ráno před druhou snídaní.", reward: 20, fine: 5, who: "Oba Hobiti", doneAdy: false, doneVydra: false },
          { id: 2, name: "KRMENÍ VRCÁKŮ A MAZLÍČKŮ", desc: "Pravidelný denní rituál v Kraji.", reward: 15, fine: 10, who: "Hobit Ady", doneAdy: false, doneVydra: false },
          { id: 3, name: "MYTÍ NÁDOBÍ Z ELFÍ HOSTINY", desc: "Umyvatelné misky a číše.", reward: 25, fine: 0, who: "Hobit Vydra", doneAdy: false, doneVydra: false }
        ]
      };
    }

    function loadDefault() {
      familyData = getDefaultTasks();
      renderApp();
    }

    function toggleTask(taskId, user) {
      if (!familyData) return;
      
      familyData.tasks = familyData.tasks.map(t => {
        if (t.id === taskId) {
          if (user === 'ady') return { ...t, doneAdy: !t.doneAdy };
          if (user === 'vydra') return { ...t, doneVydra: !t.doneVydra };
        }
        return t;
      });

      renderApp();

      try {
        firebase.firestore().collection("families").doc("hlavni_rodina").update({ tasks: familyData.tasks });
      } catch(e) {}
    }

    function renderApp() {
      if (!familyData) return;

      const container = document.getElementById("tasks-container");
      container.innerHTML = familyData.tasks.map(t => `
        <div class="task-card">
          <div class="task-tags">
            <span class="tag-who">${t.who}</span>
            ${t.fine ? `<span class="tag-fine">Pokuta ${t.fine} Kč</span>` : ''}
          </div>
          <div class="task-header">
            <div>
              <div class="task-name">${t.name}</div>
              <div class="task-desc">${t.desc}</div>
            </div>
            <div class="task-reward">+${t.reward} Kč</div>
          </div>
          <div class="user-actions">
            ${(t.who === 'Oba Hobiti' || t.who === 'Hobit Ady') ? `
              <div class="user-row">
                <span><strong>ᛓ HOBIT ADY:</strong></span>
                <button class="btn-status ${t.doneAdy ? 'btn-done' : 'btn-todo'}" onclick="toggleTask(${t.id}, 'ady')">
                  ${t.doneAdy ? '✔ HOTOVO' : '✔ SPLNĚNO (POSLAT)'}
                </button>
              </div>
            ` : ''}
            ${(t.who === 'Oba Hobiti' || t.who === 'Hobit Vydra') ? `
              <div class="user-row">
                <span><strong>🦦 HOBIT VYDRA:</strong></span>
                <button class="btn-status ${t.doneVydra ? 'btn-done' : 'btn-todo'}" onclick="toggleTask(${t.id}, 'vydra')">
                  ${t.doneVydra ? '✔ HOTOVO' : '✔ SPLNĚNO (POSLAT)'}
                </button>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
