<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legenda o Kapesném</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --gold: #f39c12;
      --gold-dark: #d35400;
      --bg-dark: #12100e;
      --card-bg: #1c1815;
      --text-light: #fefefe;
      --accent-red: #e74c3c;
      --accent-green: #2ecc71;
      --gold-border: rgba(243, 156, 18, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 12px;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, #2a1a0e, #422915);
      color: var(--gold);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-logo-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: bold; font-size: 1.2rem;
    }

    .header-title h1 { font-size: 1rem; font-weight: 900; color: #fff; }
    .header-status { font-size: 0.72rem; color: #a0a0a0; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: #2ecc71; }

    .btn-profile-select {
      background: #18110b;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .profile-dropdown {
      display: none;
      position: absolute;
      top: 60px; right: 16px;
      background: #1c1815;
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      z-index: 200;
      width: 220px;
    }
    .profile-dropdown.open { display: block; }
    .profile-option {
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 1px solid rgba(243, 156, 18, 0.15);
    }

    .active-profile-banner {
      background: #18130e;
      border: 1px dashed var(--gold-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #aaa;
      margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .active-profile-banner strong { color: var(--gold); }

    .role-bar {
      display: flex; gap: 6px; margin-bottom: 14px;
      background: #0a0806; padding: 4px; border-radius: 12px;
      border: 1px solid var(--gold-border);
    }

    .role-tab {
      flex: 1; background: transparent; border: none; color: #888;
      padding: 10px 4px; border-radius: 8px; font-weight: bold;
      font-size: 0.82rem; cursor: pointer; text-align: center;
    }
    .role-tab.active { background: var(--gold); color: #000; }

    .btn-action {
      background: var(--gold); color: #000; border: none;
      padding: 10px; border-radius: 8px; font-weight: 900;
      font-size: 0.85rem; cursor: pointer; width: 100%; margin-bottom: 10px;
    }
    .btn-fine { background: var(--accent-red); color: #fff; }
    .btn-reset { background: #3498db; color: #fff; }
    .btn-delete { background: #c0392b; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

    .section-title {
      color: var(--gold); padding-bottom: 6px; margin: 16px 0 10px;
      font-size: 0.95rem; font-weight: 800; display: flex; justify-content: space-between;
    }

    .task-card {
      background-color: var(--card-bg); border-radius: 14px; padding: 12px;
      margin-bottom: 10px; border: 1px solid var(--gold-border);
    }

    .task-tags { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tag-who { background: #332215; color: #f39c12; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .tag-fine { background: #4a1515; color: #ff6b6b; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-name { font-size: 1rem; font-weight: 800; color: #fff; }
    .task-desc { font-size: 0.8rem; color: #999; margin-bottom: 12px; }

    .task-reward {
      background: rgba(243, 156, 18, 0.15); color: var(--gold);
      padding: 4px 10px; border-radius: 8px; font-weight: 900;
      border: 1px solid var(--gold); white-space: nowrap;
    }

    .user-actions { display: flex; flex-direction: column; gap: 6px; }
    .user-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #120e0b; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem;
    }

    .btn-status {
      border: none; padding: 6px 12px; border-radius: 8px;
      font-weight: bold; font-size: 0.78rem; cursor: pointer;
    }
    .btn-todo { background: #1b4d2e; color: #2ecc71; border: 1px solid #2ecc71; }
    .btn-done { background: #2ecc71; color: #000; }
    .btn-disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0d0a08; border-top: 1.5px solid var(--gold);
      padding: 10px 14px; display: flex; justify-content: space-around; z-index: 100;
    }

    .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .nav-item.active { color: var(--gold); }

    .page-section { display: none; }
    .page-section.active { display: block; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 300; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #1c1815; border: 1.5px solid var(--gold); border-radius: 16px;
      padding: 20px; width: 100%; max-width: 360px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 900; color: var(--gold); margin-bottom: 12px; text-align: center; }
    .modal-input {
      width: 100%; background: #120e0b; border: 1px solid var(--gold-border);
      color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-modal-cancel { background: #333; color: #ccc; }
    .btn-modal-save { background: var(--gold); color: #000; }
  </style>
</head>

        <h1>LEGENDA O KAPESNÉM</h1>
        <div class="header-status"><span id="status-dot" class="status-dot"></span> <span id="db-status-text">Připojování...</span></div>
      </div>
    </div>
    <button class="btn-profile-select" id="btn-profile" onclick="toggleMenu()">🧙‍♂️ SARUMAN ∨</button>

    <div class="profile-dropdown" id="profile-dropdown">

      <div class="profile-option" style="color:var(--gold);" onclick="openPinConfig()">🔑 Změna PINů</div>
    </div>
  </header>
