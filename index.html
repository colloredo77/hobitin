<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legenda o Kapesném</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-dark: #aa7c11;
      --bg-dark: #12100e;
      --card-bg: #1c1815;
      --text-light: #f3ebd7;
      --accent-red: #8b0000;
      --accent-green: #2e7d32;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      font-family: 'Georgia', serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 12px;
      padding-bottom: 80px;
    }

    header {
      text-align: center;
      background: linear-gradient(135deg, #2c1d11, #4a321a);
      color: var(--gold);
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 16px;
    }

    header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 1px; }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .role-btn {
      background: var(--card-bg);
      border: 1px solid var(--gold-dark);
      color: var(--text-light);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .role-btn.active {
      background: var(--gold-dark);
      color: #000;
      border-color: var(--gold);
    }

    .section-title {
      color: var(--gold);
      border-bottom: 1px solid var(--gold-dark);
      padding-bottom: 4px;
      margin: 16px 0 10px;
      font-size: 1.1rem;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-info { flex-grow: 1; }
    .task-title { font-weight: bold; color: var(--text-light); }
    .task-reward { font-size: 0.85rem; color: var(--gold); }

    .btn-action {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-action.done { background: var(--accent-green); color: #fff; }

    .status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0a0908;
      border-top: 2px solid var(--gold);
      padding: 12px;
      text-align: center;
      font-weight: bold;
      color: var(--gold);
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCQjpUXAuZi08D96BX0JKAuGNE4E3xq0Q",
      authDomain: "hobiti-kapesne-2d8ae.firebaseapp.com",
      projectId: "hobiti-kapesne-2d8ae",
      storageBucket: "hobiti-kapesne-2d8ae.firebasestorage.app",
      messagingSenderId: "6584046927",
      appId: "1:6584046927:web:c13c1760d0d1997f4da13a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).then(() => {
      console.log("Přihlášeno k Firebase");
      initSync();
    }).catch(err => console.error(err));

    function initSync() {
      const docRef = doc(db, "families", "hlavni_rodina");
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          renderData(docSnap.data());
        } else {
          const defaultData = {
            adyGolds: 0,
            vydraGolds: 0,
            tasks: [
              { id: 1, name: "Úklid pokoje", reward: 10, doneAdy: false, doneVydra: false }
            ]
          };
          setDoc(docRef, defaultData);
        }
      });
    }

    function renderData(data) {
      document.getElementById("ady-gold").innerText = data.adyGolds || 0;
      document.getElementById("vydra-gold").innerText = data.vydraGolds || 0;
    }
  </script>
</head>
<body>

  <header>
    <h1>Legenda o Kapesném</h1>
  </header>

  <div class="role-selector">
    <button class="role-btn active">🧙‍♂️ Saruman & Galadriel</button>
    <button class="role-btn">ᛓ Hobit Ady (<span id="ady-gold">0</span> 💰)</button>
    <button class="role-btn">🦦 Hobit Vydra (<span id="vydra-gold">0</span> 💰)</button>
  </div>

  <div class="section-title">Aktivní výpravy (Úkoly)</div>

  <div class="task-card">
    <div class="task-info">
      <div class="task-title">Úklid pokoje</div>
      <div class="task-reward">+10 Zlaťáků</div>
    </div>
    <button class="btn-action">Odevzdat</button>
  </div>

  <div class="status-bar">
    Propojeno s Firebase: hobiti-kapesne-2d8ae
  </div>

</body>
</html>
